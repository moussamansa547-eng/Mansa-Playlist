    <script>
      // Gracefully handle Vite HMR WebSocket connection closed logs in AI Studio preview iframe where HMR is disabled
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('WebSocket closed without opened')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('WebSocket closed without opened')) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason.message || event.reason).includes('WebSocket closed without opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (event && (String(event.message || '').includes('WebSocket closed without opened') || (event.error && String(event.error).includes('WebSocket closed without opened')))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 font-sans">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
