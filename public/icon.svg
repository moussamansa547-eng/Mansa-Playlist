<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#04091e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="2" />

  <!-- Ambient Golden Center Glow -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)" />

  <!-- Acoustic Wave Rings -->
  <circle cx="256" cy="220" r="170" fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="8 8" />
  <circle cx="256" cy="220" r="130" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="256" cy="220" r="90" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Central Eloquence Flame / Voice Emblem -->
  <g filter="url(#subtleGlow)">
    <!-- Orator Rostrum Base -->
    <path d="M168 376 L344 376 L324 404 L188 404 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M228 376 L228 320 L284 320 L284 376 Z" fill="url(#goldGrad)" opacity="0.85" />
    <rect x="204" y="312" width="104" height="12" rx="4" fill="url(#goldGrad)" />

    <!-- Vintage Microphone / Torch of Eloquence Head -->
    <!-- U-shaped suspension bracket -->
    <path d="M196 220 C196 266 222 292 256 292 C290 292 316 266 316 220" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <line x1="256" y1="292" x2="256" y2="314" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Microphone Capsule Body -->
    <rect x="220" y="140" width="72" height="114" rx="36" fill="url(#goldGrad)" />
    <!-- Grill detailing -->
    <line x1="226" y1="184" x2="286" y2="184" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="226" y1="202" x2="286" y2="202" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="234" y1="166" x2="278" y2="166" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="256" y1="144" x2="256" y2="224" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Ascending Speech Spark / Inspiration Diamond -->
    <path d="M256 94 L266 114 L286 124 L266 134 L256 154 L246 134 L226 124 L246 114 Z" fill="#fef08a" />
  </g>
</svg>
